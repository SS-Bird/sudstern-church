<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Random Stunning Dilapidated Churches Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;700&family=Nunito:wght@400;700;900&family=Pacifico&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/stickers.css">
  <link rel="stylesheet" href="css/dictionary.css">
  <link rel="stylesheet" href="css/newsletter.css">
  <link rel="stylesheet" href="css/scene1.css">
</head>
<body class="scene1">
  <div class="topbar">
    <span>✈️ FREE SHIPPING ON ALL CHURCHES</span>
    <span>☀️ Berlin 14°C</span>
    <span>💌 Join 3 subscribers!</span>
  </div>

  <header class="site-header">
    <a class="logo" href="index.html">⛪ <span id="site-name"></span> ✨</a>
    <nav>
      <a>Home</a><a>Destinations</a><a>Churches</a><a>Roundabouts</a><a>About Brittany</a>
    </nav>
  </header>

  <div class="layout">
    <main class="post">
      <h1 class="list-title" id="list-title"></h1>
      <p class="byline" id="byline"></p>
      <ol class="church-list" id="church-list"></ol>
    </main>
    <aside class="ad-sidebar" id="ad-sidebar" aria-label="Advertisements"></aside>
  </div>

  <footer class="site-footer" id="site-footer"></footer>
  <div class="ad-footer" id="ad-footer"></div>

  <!-- The "hijacked ad" screen (ad clicks), text in script/scene1-marx.md -->
  <div class="overlay marx" id="marx" hidden role="dialog" aria-modal="true" aria-label="This ad has been hijacked">
    <div class="marx-inner">
      <p class="hack-banner" id="hack-banner"></p>
      <blockquote id="marx-quote"></blockquote>
      <cite id="marx-source"></cite>
      <p class="hack-message" id="hack-message"></p>
      <a class="hack-link" id="hack-link" target="_blank" rel="noopener"></a>
      <button class="marx-close" id="marx-close"></button>
    </div>
  </div>

  <!-- White strike screen (churches 2–5) -->
  <div class="overlay strike" id="strike" hidden role="dialog" aria-modal="true">
    <div class="strike-inner">
      <p id="strike-text"></p>
      <button class="strike-btn" id="strike-back"></button>
      <a class="strike-btn strike-leave" id="strike-leave" hidden></a>
    </div>
  </div>

  <script src="js/content.js"></script>
  <script src="js/stickers.js"></script>
  <script src="js/dictionary.js"></script>
  <script src="js/newsletter.js"></script>
  <script src="js/scene1.js"></script>
</body>
</html>
