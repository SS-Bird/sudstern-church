<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Sudstern Church</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/stickers.css">
  <link rel="stylesheet" href="css/dictionary.css">
  <link rel="stylesheet" href="css/newsletter.css">
  <link rel="stylesheet" href="css/scene2.css">
</head>
<body class="scene2" data-page="sudstern">
  <div class="maps">
    <aside class="panel" id="panel">
      <form class="search" id="search" role="search">
        <span class="search-menu" aria-hidden="true">☰</span>
        <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search">
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </form>

      <div class="place-head">
        <h1 id="place-name"></h1>
        <div class="place-rating" id="place-rating"></div>
        <div class="place-sub" id="place-sub"></div>
      </div>

      <div class="tabs" aria-hidden="true">
        <span>Overview</span><span class="active">Reviews</span><span>About</span>
      </div>

      <section class="reviews" id="reviews" aria-label="Reviews"></section>

      <!-- The replier's profile page (## Profile in script/scene2-sudstern.md) -->
      <section class="profile" id="profile" hidden aria-label="Profile">
        <button class="profile-back" id="profile-back">← Back to reviews</button>
        <div class="profile-body"></div>
      </section>
    </aside>

    <section class="viewer" id="viewer" aria-roledescription="carousel" aria-label="Photos">
      <div class="slides" id="slides"></div>
      <button class="nav prev" id="prev" aria-label="Previous photo">‹</button>
      <button class="nav next" id="next" aria-label="Next photo">›</button>
      <div class="counter" id="counter"></div>
      <div class="dots" id="dots"></div>
    </section>
  </div>

  <script src="js/content.js"></script>
  <script src="js/stickers.js"></script>
  <script src="js/dictionary.js"></script>
  <script src="js/newsletter.js"></script>
  <script src="js/maps.js"></script>
</body>
</html>
